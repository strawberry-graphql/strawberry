name: 🔂 Unit tests

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-jobs-tests:
    name: 💻 Generate test matrix
    runs-on: ubuntu-latest
    outputs:
      sessions: ${{ steps.set-matrix.outputs.sessions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - id: set-matrix
        shell: bash
        run: |
          echo sessions=$(
            uv run nox --json -t tests -l |
            jq 'map(
              {
                session,
                python: .python,
                name: "\( .name ) on \( .python )\( if .call_spec != {} then " (\(.call_spec | to_entries | map("\(.key)=\(.value)") | join(", ")))" else "" end )"
              }
            )'
          ) | tee --append $GITHUB_OUTPUT

  unit-tests:
    name: 🔬 ${{ matrix.session.name }}
    needs: [generate-jobs-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJson(needs.generate-jobs-tests.outputs.sessions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        if: ${{ matrix.session.python != '3.15' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.session.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.session.python }}
          enable-cache: true

      - run: uv sync
      - run: uv run nox -r -s "${{ matrix.session.session }}"
      - name: Rename coverage data
        if: ${{ always() }}
        run: |
          if [ -f .coverage ]; then
            mv .coverage ".coverage.${{ matrix.session.session }}"
          fi
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-data-${{ matrix.session.session }}
          path: ".coverage.${{ matrix.session.session }}"
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: 📊 Combine & check coverage
    if: always()
    needs: [unit-tests, unit-tests-on-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage & generate report
        run: |
          uv run --with coverage[toml] --with diff-cover coverage combine
          uv run --with coverage[toml] coverage xml
          uv run --with coverage[toml] coverage html --skip-covered --skip-empty
          uv run --with coverage[toml] coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Generate diff coverage report
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "## Diff Coverage" >> $GITHUB_STEP_SUMMARY
          uv run --with coverage[toml] --with diff-cover diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --markdown-report diff-cover.md --fail-under=0 || true
          cat diff-cover.md >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-report
          path: coverage_html_report

  benchmarks:
    name: 📈 Benchmarks (${{ matrix.shard }}/4)

    # Keep the measurement environment stable; upgrades start a new baseline.
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14.7"

      - run: uv sync --locked

      - name: Record benchmark environment
        run: uv run python -m tests.benchmarks.metadata benchmark-artifacts/environment.json --instrument simulation

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          run: >-
            uv run pytest tests/benchmarks --codspeed
            -p no:codeflash-benchmark
            -m "not benchmark_stress and not benchmark_native"
            --junitxml=benchmark-artifacts/results.xml
            --test-group=${{ matrix.shard }}
            --test-group-count=4

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-simulation-${{ matrix.shard }}
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 30

  lint:
    name: ✨ Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync

      - run: |
          mkdir -p .mypy_cache

          uv run mypy --install-types --non-interactive --cache-dir=.mypy_cache/ --config-file mypy.ini

  unit-tests-on-windows:
    name: 🪟 Tests on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"

      - run: uv sync

      # we use uv directly instead of nox since we want to
      # test all integrations at once on windows
      - run: |
          uv run pytest --cov=. --cov-append -n auto --showlocals -vv

      - name: Rename coverage data
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f .coverage ]; then
            mv .coverage .coverage.windows
          fi

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-data-windows
          path: .coverage.windows
          include-hidden-files: true
          if-no-files-found: ignore

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - generate-jobs-tests
      - unit-tests
      - unit-tests-on-windows
      - coverage
      - benchmarks
      - lint
    runs-on: ubuntu-latest

    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")'
