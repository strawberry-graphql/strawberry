name: Benchmark memory

on:
  # Exercise new or changed workflow wiring before it becomes a nightly job.
  pull_request:
    paths:
      - ".github/workflows/benchmark-memory.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-memory
  cancel-in-progress: false

jobs:
  memory:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14.7"
      - run: uv sync --locked
      - name: Record benchmark environment
        run: uv run python -m tests.benchmarks.metadata benchmark-artifacts/environment.json --instrument memory
      - name: Measure allocations
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: memory
          run: >-
            uv run pytest tests/benchmarks --codspeed -p no:codeflash-benchmark
            -m benchmark_memory --junitxml=benchmark-artifacts/results.xml
      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-memory
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 90
