name: Benchmark memory

on:
  # Exercise new or changed workflow wiring before it becomes a nightly job.
  pull_request:
    paths:
      - ".github/workflows/benchmark-memory.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-memory
  cancel-in-progress: false

jobs:
  memory:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14.7"
      - run: uv sync --locked
      - name: Record benchmark environment
        run: uv run python -m tests.benchmarks.metadata benchmark-artifacts/environment.json --instrument memory
      - name: Measure allocations
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: memory
          run: >-
            uv run pytest tests/benchmarks --codspeed -p no:codeflash-benchmark
            -m benchmark_memory --junitxml=benchmark-artifacts/results.xml
      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-memory
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 90
